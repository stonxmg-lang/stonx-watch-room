  .sec:first-child { padding-top:2px; } .sec .cnt { background:#ffffff12; color:#cfd3da; border-radius:99px; padding:0 7px; font-size:10.5px; line-height:17px; }

  .mem.off .av { filter:grayscale(1) brightness(.6); } .mem.off .av::after { background:#5a606b; }

  .mem .tx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .mem b { font-size:13.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .mem.off b { color:#9aa0aa; }
  .mem b em { font-style:normal; font-weight:600; font-size:11px; color:var(--mut); margin-inline-start:4px; }
  .mem small { font-size:11px; color:var(--mut); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mem .acts { display:flex; gap:5px; flex:none; }
  .mem .acts button { width:28px; height:28px; border:0; border-radius:50%; cursor:pointer; display:grid; place-items:center; font:800 14px/1 system-ui,sans-serif; background:#ffffff12; color:var(--fg); }
  .mem .acts .yes { background:var(--acc); color:#04140a; } .mem .acts .no { background:#ff3b4e22; color:#ff6b78; }

  .sound.show { display:block; }
  /* settings: same compact look as the members list — small sections, one-line rows with an icon tile */
  #menu { width:min(290px,calc(100vw - 20px)); padding:8px; max-height:72vh; }
  .mi { display:flex; align-items:center; gap:10px; width:100%; background:none; border:0; border-radius:10px; padding:7px 6px; cursor:pointer;
        font:inherit; font-size:13.5px; font-weight:700; color:var(--fg); text-align:start; }
  .mi:active, .mi:hover { background:#ffffff0d; }
  .mi b { width:30px; height:30px; border-radius:9px; background:#ffffff10; display:grid; place-items:center; font-size:15px; flex:none; }
  .mi span { flex:1; min-width:0; } .mi.dan { color:#ff6b78; } .mi.dan b { background:#ff3b4e1c; }

  .tog.on .sw { background:var(--acc); } .tog.on .sw::after { inset-inline-start:19px; }
  .menu .hint { font-size:11px; color:var(--mut); line-height:1.6; padding:6px 6px 2px; }

  .up .l1 { font-weight:800; font-size:14px; margin-bottom:8px; } .up .l2 { font-size:12px; color:var(--mut); margin-top:8px; line-height:1.6; }
  .pb { height:6px; border-radius:6px; background:#ffffff1f; overflow:hidden; } .pb b { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .pb.ind b { width:30%; animation:ind 1.2s infinite ease-in-out; } @keyframes ind { from { margin-left:-30%; } to { margin-left:100%; } }
  /* live reactions + quick chat (TikTok-live style) */

  @keyframes flyup { 0% { transform:translate(0,0) scale(.5); opacity:0; } 12% { opacity:.85; transform:translate(var(--dx1),-50px) scale(1.15); }

  .chatlog { position:fixed; z-index:12; inset-inline-start:12px; bottom:max(118px,calc(env(safe-area-inset-bottom) + 112px)); width:min(72vw,360px);

  .chatlog div { color:#fff; }
  .chatlog .who { color:#5ff09a; font-weight:800; margin-inline-end:5px; }
  @keyframes cin { from { opacity:0; transform:translateY(8px); } }
  .tray, .chatbar { position:fixed; z-index:16; bottom:max(100px,calc(env(safe-area-inset-bottom) + 94px)); display:none; }
  .tray { left:50%; transform:translateX(-50%); gap:2px; background:var(--card); backdrop-filter:blur(12px); border:1px solid var(--line); border-radius:99px;
          padding:0 4px 0 8px; max-width:calc(100vw - 20px); align-items:stretch; }
  .tray .list { display:flex; gap:2px; min-width:0; overflow-x:auto; scrollbar-width:none; padding:8px 2px 4px; overscroll-behavior:contain; }
  .tray .list::-webkit-scrollbar { display:none; }
  .tray button { position:relative; flex:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:pan-x; }
  .tray .del { position:absolute; top:-5px; right:-3px; width:17px; height:17px; border-radius:50%; background:var(--red); color:#fff;
               font:800 14px/16px system-ui,sans-serif; text-align:center; display:none; box-shadow:0 1px 4px #0008; }
  .tray.editing .del { display:block; }
  .tray .edit { color:#cfd3da; border-inline-start:1px solid var(--line); margin-inline-start:2px; padding-inline:10px; display:grid; place-items:center; touch-action:manipulation; }
  .tray .edit svg { width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tray .edit .plus { display:none; font-size:26px; font-weight:800; color:var(--acc); line-height:1; }
  .tray.editing .edit svg { display:none; } .tray.editing .edit .plus { display:block; }
  .tray .edit input { position:absolute; inset:0; width:100%; height:100%; opacity:.01; border:0; background:none; color:transparent; font-size:16px; display:none; }
  .tray.editing .edit input { display:block; }
  .tray.show, .chatbar.show { display:flex; }

  .tray button:active { transform:scale(1.3); }
  .chatbar { inset-inline:10px; gap:8px; }
  .chatbar input { flex:1; min-width:0; font:inherit; font-size:16px; background:#0b0d12ee; border:1px solid var(--line); color:var(--fg); border-radius:99px; padding:0 16px; height:48px; }
  .chatbar button { flex:none; width:48px; height:48px; border:0; border-radius:50%; background:var(--acc); color:#04140a; cursor:pointer; display:grid; place-items:center; align-self:center; }
  .chatbar button svg { width:24px; height:24px; fill:currentColor; }

  body:has(.chatbar.show) .chatlog { bottom:calc(max(160px,calc(env(safe-area-inset-bottom) + 154px)) + var(--ab,0px)); }
  /* @mentions: picked people show as small chips in the chat bar; a message with chips goes to them only */
  .chatbar .above { position:absolute; bottom:calc(100% + 8px); inset-inline:0; display:flex; flex-direction:column; gap:6px; }
  .chatbar .chips { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; align-items:center; }
  /* replying: a small quote of the message above the input, WhatsApp style */
  .rq { display:none; align-items:center; gap:8px; background:var(--card); backdrop-filter:blur(12px); border:1px solid var(--line); border-inline-start:3px solid var(--acc);
        border-radius:12px; padding:6px 10px; font-size:12.5px; max-width:420px; }
  .rq.show { display:flex; } .rq .tx { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#cfd3da; }
  .rq .tx b { color:#5ff09a; margin-inline-end:5px; } .rq .x { flex:none; cursor:pointer; color:var(--mut); font:800 14px/1 system-ui,sans-serif; padding:4px; }
  .chatlog div { pointer-events:auto; cursor:pointer; } .chatlog .typing { pointer-events:none; }

  .chatlog .typing { color:#b9bec7; font-weight:600; font-size:13px; padding:4px 12px; animation:none; display:flex; align-items:center; gap:7px; }
  .chatlog .typing:empty { display:none; }
  .chatlog .typing i { display:inline-flex; gap:3px; } .chatlog .typing i b { width:5px; height:5px; border-radius:50%; background:#5ff09a; animation:dot 1.2s infinite; }
  .chatlog .typing i b:nth-child(2) { animation-delay:.2s; } .chatlog .typing i b:nth-child(3) { animation-delay:.4s; }

    .pill { font-size:11px; padding:5px 8px; gap:4px; }
    .row { gap:2px; }
    .ib { width:34px; }
    .ib.big svg { width:26px; height:26px; }
    .time { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:clip; }
  }
  .toast { position:fixed; z-index:30; top:max(70px,calc(env(safe-area-inset-top) + 60px)); left:50%; transform:translateX(-50%); background:#222733f2; padding:9px 18px; border-radius:99px; font-size:14px; display:none; white-space:nowrap; }

  if (!replyTo) { el.classList.remove('show'); el.replaceChildren(); return syncAbove(); }
  const tx = document.createElement('span'), b = document.createElement('b'), x = document.createElement('span');
  tx.className = 'tx'; b.textContent = t('replyTo', { n: replyTo.c === cid ? t('you') : shown(replyTo.c, replyTo.n) }); tx.append(b, document.createTextNode(replyTo.x));
  x.className = 'x'; x.textContent = '✕'; x.onpointerdown = (e) => e.preventDefault(); x.onclick = (e) => { e.stopPropagation(); replyTo = null; drawReply(); $('chatIn').focus(); };
  el.replaceChildren(tx, x); el.classList.add('show'); syncAbove();
}
function startReply(q) {
  if (isMuted(cid)) return toast(t('mutedNow'));
  replyTo = q; $('tray').classList.remove('show'); $('chatbar').classList.add('show'); drawReply(); $('chatIn').focus();
}
function drawChips() {
  $('chips').replaceChildren(...[...picked].map(([c, name]) => {
    const ch = document.createElement('span'); ch.className = 'chip'; ch.textContent = '@' + name;
    ch.onpointerdown = (e) => e.preventDefault();
    ch.onclick = (e) => { e.stopPropagation(); picked.delete(c); drawChips(); $('chatIn').focus(); };
    return ch;
  }));
  syncAbove();
}
function hideMention() { atFrom = -1; $('mention').classList.remove('show'); }
function pickMention(p) {
  const el = $('chatIn'), v = el.value, end = el.selectionStart ?? v.length;
  el.value = v.slice(0, atFrom) + v.slice(end); el.setSelectionRange(atFrom, atFrom);
  if (atMode === '£') {
    if (cid === room.owner) { const on = hasCtl(p.cid); act(on ? 'ctlOff' : 'ctlOn', { cid: p.cid }); toast(t(on ? 'ctlTookX' : 'ctlGaveX', { n: p.name || t('guest') })); }
    hideMention(); el.focus(); typingPing(); return;
  }
  if (atMode === '#') {
    if (cid === room.owner) { const on = isMuted(p.cid); act(on ? 'unmute' : 'mute', { cid: p.cid }); toast(t(on ? 'unmutedX' : 'mutedX', { n: p.name || t('guest') })); }
    hideMention(); el.focus(); typingPing(); return;
  }
  picked.set(p.cid, p.name || t('guest')); drawChips(); hideMention(); el.focus();
}
function hintMention(txt) {
  atFrom = -1; const d = document.createElement('div'); d.className = 'head'; d.textContent = txt;
  $('mention').replaceChildren(d); $('mention').classList.add('show');
}
let atMode = '@';   // '@' picks who a message goes to; '#' (owner only) switches someone's reactions and comments off/on
function showMention() {
  const el = $('chatIn'), v = el.value, caret = el.selectionStart ?? v.length;
  const owner = cid === room.owner, a1 = v.lastIndexOf('@', caret - 1), a2 = owner ? v.lastIndexOf('#', caret - 1) : -1, a3 = owner ? v.lastIndexOf('£', caret - 1) : -1;
  const at = Math.max(a1, a2, a3);
  if (!owner && v.trim() === '£') return hintMention(t('poundOwnerOnly'));
  if (!owner && v.trim() === '#') return hintMention(t('hashOwnerOnly'));   // say why nothing comes up
  if (at < 0 || (at > 0 && !/\s/.test(v[at - 1]))) return hideMention();
  atMode = v[at];
  if (atMode === '@' && namesHidden()) return hideMention();
  const q = v.slice(at + 1, caret).trim().toLowerCase();
  const pool = live().filter((p) => (atMode !== '@' ? p.cid !== room.owner : !picked.has(p.cid)));
  atList = pool.filter((p) => (p.name || t('guest')).toLowerCase().includes(q));
  if (!atList.length) return pool.length ? hideMention() : hintMention(t('noMembers'));
  atFrom = at; atHi = Math.min(atHi, atList.length - 1);
  const rows = atList.map((p, k) => {
    const r = document.createElement('div'), i = document.createElement('i'), nm = document.createElement('span');
    nm.textContent = p.name || t('guest'); r.append(i, nm); r.className = (k === atHi ? 'hi' : '') + (isMuted(p.cid) ? ' muted' : '');
    if (atMode === '#') { const st = document.createElement('span'); st.className = 'st'; st.textContent = isMuted(p.cid) ? t('tapUnmute') : t('tapMute'); r.append(st); }
    if (atMode === '£') { const st = document.createElement('span'); st.className = 'st'; st.textContent = hasCtl(p.cid) ? t('takeCtl') : t('giveCtl'); r.append(st); }
    r.onpointerdown = (e) => { e.preventDefault(); pickMention(p); };   // keep the keyboard open
    return r;
  });
  if (atMode !== '@') { const hd = document.createElement('div'); hd.className = 'head'; hd.textContent = atMode === '#' ? t('muteHead') : t('ctlHead') + (room.lockCtl ? '' : ' — ' + t('ctlOpenHint')); rows.unshift(hd); }
  $('mention').replaceChildren(...rows);
  $('mention').classList.add('show');
}
$('chatIn').addEventListener('input', showMention);
$('chatIn').addEventListener('click', showMention);
$('chatIn').addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' && !$('chatIn').value && picked.size) { picked.delete([...picked.keys()].pop()); drawChips(); return; }
  if (atFrom < 0) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); atHi = (atHi + (e.key === 'ArrowDown' ? 1 : atList.length - 1)) % atList.length; showMention(); }
  else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(atList[atHi]); }
  else if (e.key === 'Escape') hideMention();
});
document.addEventListener('click', (e) => { if (!e.target.closest('.tray, .chatbar, .mention')) { hideMention(); $('tray').classList.remove('show'); setEditing(false); $('chatbar').classList.remove('show'); } });

// ---------------- self-update ----------------
// Each published version of this page carries its own build id (the <meta name="build"> up top). Every minute, and
// whenever the app comes back to the screen, we peek at the live page's id. When it changed, the room updates as one:
// the master pauses the movie, tells everyone to reload, and once the same people are back it carries on playing by
// itself from the same second. The movie, the place in it and the parts already received are kept in each browser.
// (Someone still reading a movie in from their phone is never reloaded; the update waits until they're done.)
const myBuild = (document.querySelector('meta[name=build]') || {}).content || '';
let newBuild = null, updating = false, askedAt = 0;
async function liveBuild() {
  try {
    const r = await fetch('/room?check=' + Date.now(), { cache: 'no-store', headers: { Range: 'bytes=0-2047' } });
    const m = (await r.text()).slice(0, 4096).match(/<meta name="build" content="([^"]+)"/);
    return m ? m[1] : null;
  } catch (e) { return null; }
}
function reloadNow() {
  try { if (joined) sessionStorage.setItem('wr_autojoin', '1'); } catch (_) {}
  const u = new URL(location.href); u.searchParams.set('v', newBuild || Date.now().toString(36));
  location.replace(u.toString());   // a fresh address, so no cached copy of the old page can come back
}
function goUpdate(delay) {
  if (updating || preparing) return;
  updating = true; toast(t('updating'));
  setTimeout(reloadNow, delay);
}
function startUpdate() {
  if (updating || preparing || !newBuild) return;
  if (!joined) return reloadNow();
  const m = masterPeer();
  if (!isMaster && m && m.ready) {
    // ask the master to update the whole room; if it can't (an older page), update on my own at a quiet moment
    if (Date.now() - askedAt > 15000) { askedAt = Date.now(); sendTo(m, { t: 'update', build: newBuild }); }
    if (Date.now() - askedAt > 10000 && room.status !== 'playing') goUpdate(0);
    return;
  }
  if (live().some((p) => p.busy)) return;   // someone is still reading a movie in; try again shortly
  if (room.status === 'playing' || (room.auto && room.status === 'paused')) {
    handleAct({ action: 'pause', auto: true });
    commit((r) => { r.upd = { n: live().length + 1, at: now() }; });
  }
  send({ t: 'update', build: newBuild });
  goUpdate(1200);
}
function onUpdateMsg(m) {
  if (!m.build || m.build === myBuild) return;
  newBuild = newBuild || m.build;
  if (isMaster) startUpdate(); else goUpdate(300);
}
async function checkUpdate() {
  if (updating) return;
  const v = await liveBuild();
  if (v && myBuild && v !== myBuild) { newBuild = v; startUpdate(); }
}
setInterval(() => { if (newBuild && !updating) startUpdate(); }, 5000);
setInterval(checkUpdate, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setTimeout(checkUpdate, 4000);

// ---------------- join ----------------
$('nameIn').value = store.get('wr_name') || '';
$('title').textContent = $('gateTitle').textContent = titleOf(); document.title = 'STONX · ' + titleOf();
let wakeLockSentinel = null;
async function keepAwake() { try { if (!wakeLockSentinel || wakeLockSentinel.released) wakeLockSentinel = await navigator.wakeLock.request('screen'); } catch (_) {} }
async function join() {
  const name = $('nameIn').value.trim() || t('guest');
  store.set('wr_name', name);
  vids.forEach((v) => { v.muted = true; v.play().catch(() => {}); v.pause(); });  // unlock playback inside the tap
  joined = true; muted = false; show(0);
  keepAwake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  $('gate').style.display = 'none';
  document.body.classList.toggle('muted-me', isMuted(cid));
  if (!room.owner && store.get('wr2_own_' + roomId)) { room.owner = cid; room.ok = [cid]; saveRoom(); }   // I made this room
  await loadHave();
  connect();
}
$('joinBtn').onclick = join;
$('nameIn').onkeydown = (e) => e.key === 'Enter' && join();
try { if (sessionStorage.getItem('wr_autojoin') && store.get('wr_name')) { sessionStorage.removeItem('wr_autojoin'); setTimeout(join, 0); } } catch (_) {}
if (!roomId) showFatal(t('badLinkT'), t('badLinkP'));
setInterval(tick, 300);
setPeerPill();
window.__wr = { get peerId() { return peer && peer.id; }, get peerOpen() { return !!(peer && peer.open && !peer.destroyed); }, get waiting() { return waiting; }, peers, get name() { return store.get('wr_name'); }, checkUpdate, get room() { return room; }, have, get connected() { return connected; }, get isMaster() { return isMaster; } };
</script>
